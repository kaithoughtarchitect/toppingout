name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        # Every platform on the public repo, where Actions is free; Linux only on the private one,
        # where macOS bills 10x and Windows 2x (each sync then runs all three on the public side).
        os: ${{ github.repository == 'kaithoughtarchitect/toppingout' && fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer self-test
        run: node skills/f-setup/install.mjs --self-test
      - name: End-game lock self-test
        run: node skills/f-signoff/endgame.mjs --self-test
      - name: Claude Code builder (stop hook and settings) self-test
        run: node skills/orca-pi-connect/claude-code/claude-builder.mjs --self-test
      - name: agy builder (stop hook and setup) self-test
        run: node skills/orca-pi-connect/agy/agy-builder.mjs --self-test
      - name: Names check self-test
        run: node skills/f-signoff/names-check.mjs --self-test
      - name: Greptile waiter self-test
        run: node skills/f-greploop/greptile-wait.mjs --self-test
      - name: Agent council self-test
        run: node skills/agent-council/scripts/agent-council.mjs self-test
      - name: Comply tests
        run: node skills/f-comply/comply.test.mjs
      - name: Cross-review dispatcher self-test
        run: node scripts/cross-review-dispatch.mjs --self-test
      - name: Plan-check dispatcher tests
        run: node skills/f-plancheck/plancheck-dispatch.test.mjs
      - name: Loose-ends lens tests
        run: node skills/f-inspect/loose-ends/loose-ends.test.mjs
      - name: Board renderer tests
        run: python skills/f-board/test_render_board.py
      - name: Board coordination branch tests (lanes)
        run: bash snippets/test_board_push.sh
      - name: Landing the tested commit (lanes)
        run: bash snippets/test_land_tested.sh
      - name: Logbook archive tests
        run: python foreman/logbook/test_archive_cards.py
      - name: Logbook index rebuild tests (lanes)
        run: python foreman/logbook/test_rebuild_index.py
      - name: Import scan tests
        run: python snippets/test_import_scan.py
      - name: Test-time tests
        run: python snippets/test_run_times.py
      - name: Site walk grader self-test
        run: node snippets/site_walk_grade.mjs --self-test
      - name: Topping Out Gaffer tests
        run: npx --yes tsx addons/gaffer/gaffer.test.ts
      - name: Snippet shell syntax
        run: bash -n snippets/run-gates.sh && bash -n snippets/parallel_proof.sh && bash -n snippets/board_push.sh && bash -n snippets/board_pull.sh && bash -n snippets/land_tested.sh
